<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Strangle Position Sizer</title>
    <script>
      // Apply the persisted / system theme before React mounts, to avoid a
      // flash of the wrong theme on load.
      (function () {
        try {
          var stored = localStorage.getItem("strangle-calc-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage unavailable — default to light */
        }
      })();
    </script>
  </head>
  <body class="bg-paper dark:bg-paper-dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
